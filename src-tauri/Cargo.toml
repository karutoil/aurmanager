[package]
name = "aurmanager"
version = "0.1.0"
description = "A fast, modern AUR-focused package manager for Arch Linux"
authors = ["AurManager"]
edition = "2021"

[lib]
name = "aurmanager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
which = "7"
log = "0.4"
env_logger = "0.11"
