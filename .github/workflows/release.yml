name: Release (Manual)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build release for (e.g. v0.2.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            zstd

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install npm dependencies
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --target x86_64-unknown-linux-gnu

      - name: Build Arch package
        run: ./build-arch.sh

      - name: Collect release assets
        run: |
          mkdir -p release-assets
          find src-tauri/target -name "*.deb" -exec cp {} release-assets/ \;
          find src-tauri/target -name "*.rpm" -exec cp {} release-assets/ \;
          find src-tauri/target -name "*.pkg.tar.zst" -exec cp {} release-assets/ \;
          echo "Collected assets:"
          ls -lh release-assets/

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: AurManager ${{ inputs.tag }}
          draft: false
          prerelease: false
          files: release-assets/*
